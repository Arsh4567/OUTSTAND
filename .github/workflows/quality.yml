name: Quality Gate

on:
  pull_request:
  # Main-branch quality runs after the lockfile sync workflow completes.
  # This prevents the initial push check from racing the lockfile update.
  workflow_run:
    workflows: ["Sync Bun lockfile"]
    types: [completed]
    branches: [main]

# Avoid wasting CI capacity on stale validation runs when new commits arrive.
concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Only validate successful lockfile-sync runs; PRs still run directly.
    if: github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Run every independent check even when an earlier one fails. This turns the
      # gate into a useful diagnostic surface instead of hiding lint/build failures
      # behind an unrelated typecheck blocker. The final step still fails the job.
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bunx tsc --noEmit
      - name: Lint
        id: lint
        continue-on-error: true
        run: bun run lint
      - name: Production build
        id: build
        continue-on-error: true
        run: bun run build

      - name: Quality gate summary
        if: always()
        env:
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          echo "Typecheck: ${TYPECHECK}"
          echo "Lint:      ${LINT}"
          echo "Build:     ${BUILD}"

          if [ "${TYPECHECK}" != "success" ] || [ "${LINT}" != "success" ] || [ "${BUILD}" != "success" ]; then
            echo "Quality Gate failed. See each check above for the independent root cause(s)."
            exit 1
          fi
