name: Roadmap type-fix runner

on:
  push:
    branches: [fix/roadmap-types]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/roadmap-types
          fetch-depth: 0
      - name: Apply precise fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def patch_core(path):
              p=Path(path); s=p.read_text()
              s=s.replace('import { createClient } from "@supabase/supabase-js";', 'import { createClient, type SupabaseClient } from "@supabase/supabase-js";')
              marker='const bearer = (req: VercelRequest) => req.headers.authorization?.startsWith("Bearer ") ? req.headers.authorization.slice(7).trim() : "";\n'
              if 'type DbClient = SupabaseClient<any' not in s: s=s.replace(marker, marker+'\ntype DbClient = SupabaseClient<any, "public", any, any, any>;\ntype AuthResult = { client: DbClient; userId: string } | { error: { status: number; message: string } };\n')
              s=s.replace('async function authenticate(req: VercelRequest) {','async function authenticate(req: VercelRequest): Promise<AuthResult> {')
              s=s.replace('const client = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false }, global: { headers: { Authorization: `Bearer ${token}` } } });','const client = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false }, global: { headers: { Authorization: `Bearer ${token}` } } }) as DbClient;')
              s=s.replace('async function retrieveCuratedResources(client: ReturnType<typeof createClient>','async function retrieveCuratedResources(client: DbClient')
              p.write_text(s)
          def patch_v2(path):
              p=Path(path); s=p.read_text()
              s=s.replace('import { createClient } from "@supabase/supabase-js";', 'import { createClient, type SupabaseClient } from "@supabase/supabase-js";')
              marker='const bearer = (req: VercelRequest) => req.headers.authorization?.startsWith("Bearer ") ? req.headers.authorization.slice(7).trim() : "";\n'
              if 'type DbClient = SupabaseClient<any' not in s: s=s.replace(marker, marker+'\ntype DbClient = SupabaseClient<any, "public", any, any, any>;\ntype AuthResult = { client: DbClient; userId: string } | { error: readonly [number, string] };\n')
              s=s.replace('async function auth(req: VercelRequest) {','async function auth(req: VercelRequest): Promise<AuthResult> {')
              s=s.replace('const client = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false }, global: { headers: { Authorization: `Bearer ${token}` } } });','const client = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false }, global: { headers: { Authorization: `Bearer ${token}` } } }) as DbClient;')
              s=s.replace('async function fallbackPlan(client: ReturnType<typeof createClient>','async function fallbackPlan(client: DbClient')
              p.write_text(s)
          patch_core('api/roadmap-core.ts'); patch_v2('api/roadmap-v2.ts'); patch_core('api/roadmap.ts')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck roadmap API files
        run: npx tsc --noEmit --strict --skipLibCheck --target ES2023 --module ESNext --moduleResolution Bundler api/roadmap-core.ts api/roadmap-v2.ts api/roadmap.ts
      - name: Commit branch fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-roadmap-types.yml
          git add api/roadmap-core.ts api/roadmap-v2.ts api/roadmap.ts .github/workflows/fix-roadmap-types.yml
          git diff --cached --quiet || git commit -m "fix(roadmap): resolve Supabase TypeScript typing errors"
          git push origin HEAD:fix/roadmap-types
      - name: Remove temporary runner from main
        run: |
          git fetch origin main
          git checkout main
          git rm .github/workflows/roadmap-type-fix-runner.yml
          git commit -m "chore: remove temporary roadmap type-fix runner"
          git push origin main
