name: Fix roadmap TypeScript types

on:
  push:
    branches: [fix/roadmap-types]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply precise type fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # roadmap-core.ts
          p = Path('api/roadmap-core.ts')
          s = p.read_text()
          s = s.replace('import { createClient } from "@supabase/supabase-js";', 'import { createClient, type SupabaseClient } from "@supabase/supabase-js";')
          marker = 'const bearer = (req: VercelRequest) => req.headers.authorization?.startsWith("Bearer ") ? req.headers.authorization.slice(7).trim() : "";\n'
          if 'type DbClient = SupabaseClient<any' not in s:
              s = s.replace(marker, marker + '\ntype DbClient = SupabaseClient<any, "public", any, any, any>;\ntype AuthResult = { client: DbClient; userId: string } | { error: { status: number; message: string } };\n')
          s = s.replace('async function authenticate(req: VercelRequest) {', 'async function authenticate(req: VercelRequest): Promise<AuthResult> {')
          s = s.replace('const client = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false }, global: { headers: { Authorization: `Bearer ${token}` } } });', 'const client = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false }, global: { headers: { Authorization: `Bearer ${token}` } } }) as DbClient;')
          s = s.replace('async function retrieveCuratedResources(client: ReturnType<typeof createClient>', 'async function retrieveCuratedResources(client: DbClient')
          p.write_text(s)

          # roadmap-v2.ts
          p = Path('api/roadmap-v2.ts')
          s = p.read_text()
          s = s.replace('import { createClient } from "@supabase/supabase-js";', 'import { createClient, type SupabaseClient } from "@supabase/supabase-js";')
          marker = 'const bearer = (req: VercelRequest) => req.headers.authorization?.startsWith("Bearer ") ? req.headers.authorization.slice(7).trim() : "";\n'
          if 'type DbClient = SupabaseClient<any' not in s:
              s = s.replace(marker, marker + '\ntype DbClient = SupabaseClient<any, "public", any, any, any>;\ntype AuthResult = { client: DbClient; userId: string } | { error: readonly [number, string] };\n')
          s = s.replace('async function auth(req: VercelRequest) {', 'async function auth(req: VercelRequest): Promise<AuthResult> {')
          s = s.replace('const client = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false }, global: { headers: { Authorization: `Bearer ${token}` } } });', 'const client = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false }, global: { headers: { Authorization: `Bearer ${token}` } } }) as DbClient;')
          s = s.replace('async function fallbackPlan(client: ReturnType<typeof createClient>', 'async function fallbackPlan(client: DbClient')
          p.write_text(s)

          # roadmap.ts: same explicit auth result/client narrowing if the file has the corresponding shape.
          p = Path('api/roadmap.ts')
          s = p.read_text()
          s = s.replace('import { createClient } from "@supabase/supabase-js";', 'import { createClient, type SupabaseClient } from "@supabase/supabase-js";')
          marker = 'const bearer = (req: VercelRequest) => req.headers.authorization?.startsWith("Bearer ") ? req.headers.authorization.slice(7).trim() : "";\n'
          if marker in s and 'type DbClient = SupabaseClient<any' not in s:
              s = s.replace(marker, marker + '\ntype DbClient = SupabaseClient<any, "public", any, any, any>;\ntype AuthResult = { client: DbClient; userId: string } | { error: { status: number; message: string } };\n')
          s = s.replace('async function authenticate(req: VercelRequest) {', 'async function authenticate(req: VercelRequest): Promise<AuthResult> {')
          s = s.replace('const client = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false }, global: { headers: { Authorization: `Bearer ${token}` } } });', 'const client = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false }, global: { headers: { Authorization: `Bearer ${token}` } } }) as DbClient;')
          p.write_text(s)
          PY

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/roadmap-core.ts api/roadmap-v2.ts api/roadmap.ts .github/workflows/fix-roadmap-types.yml
          git diff --cached --quiet && exit 0
          git rm .github/workflows/fix-roadmap-types.yml
          git commit -m "fix(roadmap): resolve Supabase TypeScript typing errors"
          git push origin HEAD:fix/roadmap-types
